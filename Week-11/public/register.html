<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #ecf0f1; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; }
        button { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Register</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pw" placeholder="Password">
        <select id="role">
            <option value="MEMBER">Member</option>
            <option value="ADMIN">Admin</option>
        </select>
        <button onclick="signup()">Create Account</button>
        <p><a href="/login.html">Already have an account?</a></p>
    </div>

    <script>
        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pw').value;
            const role = document.getElementById('role').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password, role})
            });
            if(res.ok) { alert('Done! Now login.'); window.location.href='/login.html'; }
        }
    </script>
</body>
</html>
